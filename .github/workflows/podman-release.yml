name: Build Podman Debian packages

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override the Podman release tag to build (for example: v5.1.0)'
        required: false
        type: string

permissions:
  contents: write

env:
  PODMAN_REPOSITORY: podman-container-tools/podman

jobs:
  resolve-release:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7
      - name: Resolve Podman release
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_INPUTS_VERSION: ${{ github.event.inputs.version }}
        shell: bash
        run: ./scripts/resolve-release.sh
      - name: Checkout Podman repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PODMAN_REPOSITORY }}
          ref: ${{ needs.resolve-release.outputs.version }}
          path: podman-src

  build-amd64:
    needs: resolve-release
    if: needs.resolve-release.outputs.should_build == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7

      - name: Checkout Podman repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PODMAN_REPOSITORY }}
          ref: ${{ needs.resolve-release.outputs.version }}
          path: podman-src


      - name: Build amd64 Debian package
        env:
          PODMAN_VERSION: ${{ needs.resolve-release.outputs.version }}
          PODMAN_SRC_DIR: ${{ github.workspace }}/podman-src
        shell: bash
        run: |
          TARGET_ARCH=amd64 DISTRO=ubuntu OUTPUT_DIR="$GITHUB_WORKSPACE/dist" PODMAN_VERSION="$PODMAN_VERSION" PODMAN_SRC_DIR="$PODMAN_SRC_DIR" ./scripts/build-deb.sh
          TARGET_ARCH=amd64 DISTRO=debian OUTPUT_DIR="$GITHUB_WORKSPACE/dist" PODMAN_VERSION="$PODMAN_VERSION" PODMAN_SRC_DIR="$PODMAN_SRC_DIR" ./scripts/build-deb.sh

      - name: Upload amd64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: podman-deb-amd64
          path: dist/*.deb
          if-no-files-found: error

  build-arm64:
    needs: resolve-release
    if: needs.resolve-release.outputs.should_build == 'true'
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7

      - name: Checkout Podman repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PODMAN_REPOSITORY }}
          ref: ${{ needs.resolve-release.outputs.version }}
          path: podman-src
      - name: Build arm64 Debian package
        env:
          PODMAN_VERSION: ${{ needs.resolve-release.outputs.version }}
          PODMAN_SRC_DIR: ${{ github.workspace }}/podman-src
        shell: bash
        run: |
          TARGET_ARCH=arm64 DISTRO=ubuntu OUTPUT_DIR="$GITHUB_WORKSPACE/dist" PODMAN_VERSION="$PODMAN_VERSION" PODMAN_SRC_DIR="$PODMAN_SRC_DIR" ./scripts/build-deb.sh
          TARGET_ARCH=arm64 DISTRO=debian OUTPUT_DIR="$GITHUB_WORKSPACE/dist" PODMAN_VERSION="$PODMAN_VERSION" PODMAN_SRC_DIR="$PODMAN_SRC_DIR" ./scripts/build-deb.sh

      - name: Upload arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: podman-deb-arm64
          path: dist/*.deb
          if-no-files-found: error

  validate-amd64:
    needs:
      - resolve-release
      - build-amd64
    if: needs.resolve-release.outputs.should_build == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Download amd64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: podman-deb-amd64
          path: artifacts/amd64

      - name: Install amd64 Debian package and verify Podman
        env:
          EXPECTED_VERSION: ${{ needs.resolve-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get purge -y podman
          sudo apt-get update
          sudo apt-get install -y ./artifacts/amd64/*.deb

          version_output="$(sudo podman --version)"
          echo "$version_output"

          expected_version="${EXPECTED_VERSION#v}"
          if [[ "$version_output" != *"$expected_version"* ]]; then
            echo "Installed Podman version '$version_output' does not match expected version '$EXPECTED_VERSION'" >&2
            exit 1
          fi

          sudo podman info >/tmp/podman-info.txt 2>/tmp/podman-info.err || {
            echo "podman info failed" >&2
            cat /tmp/podman-info.err >&2
            exit 1
          }

          sudo podman run --rm hello-world >/tmp/podman-hello-world.txt 2>/tmp/podman-hello-world.err || {
            echo "podman hello-world failed" >&2
            cat /tmp/podman-hello-world.err >&2
            exit 1
          }

  validate-arm64:
    needs:
      - resolve-release
      - build-arm64
    if: needs.resolve-release.outputs.should_build == 'true'
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Download arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: podman-deb-arm64
          path: artifacts/arm64

      - name: Install arm64 Debian package and verify Podman
        env:
          EXPECTED_VERSION: ${{ needs.resolve-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get purge -y podman
          sudo apt-get update
          sudo apt-get install -y ./artifacts/arm64/*.deb

          version_output="$(sudo podman --version)"
          echo "$version_output"

          expected_version="${EXPECTED_VERSION#v}"
          if [[ "$version_output" != *"$expected_version"* ]]; then
            echo "Installed Podman version '$version_output' does not match expected version '$EXPECTED_VERSION'" >&2
            exit 1
          fi

          sudo podman info >/tmp/podman-info.txt 2>/tmp/podman-info.err || {
            echo "podman info failed" >&2
            cat /tmp/podman-info.err >&2
            exit 1
          }

          sudo podman run --rm hello-world >/tmp/podman-hello-world.txt 2>/tmp/podman-hello-world.err || {
            echo "podman hello-world failed" >&2
            cat /tmp/podman-hello-world.err >&2
            exit 1
          }

  publish-release:
    needs:
      - resolve-release
      - build-amd64
      - build-arm64
      - validate-amd64
      - validate-arm64
    if: needs.resolve-release.outputs.should_build == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: podman-deb-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PODMAN_VERSION: ${{ needs.resolve-release.outputs.version }}
        shell: bash
        run: ./scripts/publish-release.sh
