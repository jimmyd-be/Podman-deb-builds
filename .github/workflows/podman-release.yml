name: Build Podman Debian packages

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override the Podman release tag to build (for example: v5.1.0)'
        required: false
        type: string

permissions:
  contents: write

env:
  PODMAN_REPOSITORY: podman-container-tools/podman

jobs:
  build-and-release:
    runs-on: ubuntu-26.04
    steps:
      - name: Resolve Podman release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_INPUTS_VERSION: ${{ github.event.inputs.version }}
        shell: bash
        run: ./scripts/resolve-release.sh

      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          path: workspace

      - name: Checkout Podman repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PODMAN_REPOSITORY }}
          ref: ${{ env.PODMAN_VERSION }}
          path: podman-src

      - name: Build Debian packages
        if: env.SHOULD_BUILD == 'true'
        shell: bash
        run: ./scripts/build-packages.sh

      - name: Upload Debian artifacts
        if: env.SHOULD_BUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: podman-deb-packages
          path: dist/*.deb
          if-no-files-found: error

      - name: Create GitHub release
        if: env.SHOULD_BUILD == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: ./scripts/publish-release.sh
